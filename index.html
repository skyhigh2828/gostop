<!doctype html>
<!-- 용도: 맞고 점수·정산 계산기 화면. 사용법: 이 파일을 브라우저로 열면 된다 (calc.js, app.js와 같은 폴더에 둘 것) -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b3261e">
<title>맞고 계산기</title>
<style>
  :root {
    --bg: #f6f3ee; --card: #ffffff; --ink: #1f1b16; --sub: #6b635a; --line: #e2dcd2;
    --accent: #b3261e; --accent-ink: #ffffff; --soft: #f3e3e0; --plus: #1b6e3c; --minus: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17140f; --card: #221e18; --ink: #f1ebe2; --sub: #a59c90; --line: #3a342b;
      --accent: #e0584e; --accent-ink: #1a0e0c; --soft: #3a211e; --plus: #6fcf97; --minus: #f28b82;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 1.45;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 4px 0 14px; }
  h2 { font-size: 14px; color: var(--sub); font-weight: 600; margin: 0 0 8px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .35; cursor: default; }
  input[type=text], input[type=number] {
    font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0;
  }
  .field { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .field > span { flex: 1; }
  .field > input[type=number] { width: 96px; flex: none; text-align: right; }
  .field small { color: var(--sub); display: block; font-size: 12.5px; }
  .field input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .primary {
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
    padding: 14px; font-weight: 700; width: 100%; font-size: 17px;
  }
  .ghost { background: transparent; border: 1px solid var(--line); border-radius: 12px; padding: 12px; width: 100%; }
  details summary { cursor: pointer; font-weight: 600; padding: 4px 0; }

  .board { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .board .who { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .board .name { font-size: 14px; color: var(--sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .bal { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .plus { color: var(--plus); } .minus { color: var(--minus); }
  .rules { font-size: 12.5px; color: var(--sub); margin: 0 2px 12px; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  .tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 10px; font-weight: 600; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg button { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px 8px; font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg button.on { border-color: var(--accent); background: var(--soft); }
  .row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .row .lbl { font-weight: 600; }
  .step { display: flex; align-items: center; gap: 6px; }
  .step button { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); font-size: 22px; line-height: 1; }
  .step button.five { width: auto; padding: 0 10px; font-size: 15px; }
  .step b { width: 38px; text-align: center; font-size: 20px; font-variant-numeric: tabular-nums; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 0 8px; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 9px 14px; font-size: 15px; }
  .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .sep { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

  .result .line { display: flex; justify-content: space-between; font-size: 14.5px; padding: 1px 0; font-variant-numeric: tabular-nums; }
  .result .total { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; }
  .result .total b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .note { font-size: 13.5px; color: var(--sub); margin: 6px 0 0; }
  .warn { color: var(--minus); }
  .actions { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .events { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .events button { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 4px; font-size: 14px; }
  .events small { display: block; color: var(--sub); font-size: 12px; }

  .log { list-style: none; margin: 0; padding: 0; }
  .log li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .log li:last-child { border-bottom: 0; }
  .log .body { flex: 1; min-width: 0; }
  .log .ttl { font-weight: 600; }
  .log .det { font-size: 12.5px; color: var(--sub); }
  .log .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .log .del { border: 0; background: transparent; color: var(--sub); padding: 2px 4px; font-size: 13px; text-decoration: underline; }
  .final { font-size: 18px; font-weight: 700; text-align: center; }
  .empty { color: var(--sub); text-align: center; padding: 18px 0; }

  dialog { border: 1px solid var(--line); border-radius: 16px; background: var(--card); color: var(--ink); padding: 18px; width: min(340px, calc(100vw - 48px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { margin: 0 0 4px; font-size: 17px; }
  dialog p { margin: 0 0 14px; color: var(--sub); font-size: 14px; }
  dialog .opts { display: grid; gap: 8px; }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
